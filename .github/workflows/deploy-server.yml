name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - ".github/workflows/deploy-server.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: teamit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        env:
          DB_URL: jdbc:mysql://localhost:3306/teamit
          DB_USERNAME: root
          DB_PASSWORD: test
          JWT_SECRET: test-secret-for-ci-must-be-at-least-256-bits-long
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: ./gradlew test --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/teamit-server:latest,${{ secrets.DOCKERHUB_USERNAME }}/teamit-server:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/teamit-server
            echo "IMAGE_TAG=${{ github.sha }}" > .image-tag.env
            docker compose --env-file .env --env-file .image-tag.env pull app
            docker compose --env-file .env --env-file .image-tag.env up -d
            docker image prune -f
