services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 500m
    # performance_schema는 MySQL 8.0 기본값(켜짐)인데, 트래픽이 거의 없어도 100MB+를
    # 잡아먹는 경우가 흔하다(실측: 트래픽 없이도 400m 한도의 97%까지 사용). 앱 레벨
    # 모니터링(Actuator/CloudWatch)이 이미 있어서 DB 내부 계측까지는 필요 없어 끈다.
    command: ["--innodb-buffer-pool-size=200M", "--max-connections=50", "--performance_schema=OFF"]
    environment:
      MYSQL_DATABASE: teamit
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 220m
    # 순수 캐시 용도라 영속성이 필요 없다 — RDB 스냅샷/AOF를 꺼서 디스크 I/O와 재시작 시
    # 로딩 시간을 없앤다(재시작 시 캐시가 비는 건 정상, DB에서 다시 채워진다).
    command: ["redis-server", "--maxmemory", "180mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${DOCKERHUB_USERNAME}/teamit-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 실측(docker stats)으로 432MiB/1000m(43%)만 쓰고 있어 여유를 mysql 쪽으로 옮겼다.
    mem_limit: 850m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      # actuator(관리용 메트릭) 전용 포트 — 127.0.0.1에만 바인딩해서 EC2 내부(SSH 후 curl)에서만 접근 가능,
      # 인터넷/nginx 어디서도 도달 불가능하다.
      - "127.0.0.1:8081:8081"
    volumes:
      - uploads-data:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/teamit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=50.0"
      # CloudWatch로 메트릭을 보내는 리전. 자격증명은 EC2 인스턴스 IAM 역할에서 자동으로 가져오므로
      # 액세스키를 여기 넣지 않는다.
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

volumes:
  mysql-data:
  uploads-data:
